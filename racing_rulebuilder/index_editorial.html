<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racing Edge — rule lab</title>
<style>
  :root{
    --bg:#f6f6f3; --card:#ffffff; --ink:#1b1c1e; --muted:#73767c; --faint:#9aa0a6;
    --line:rgba(20,20,20,0.10); --line-soft:rgba(20,20,20,0.06);
    --accent:#2f6fed; --chip:#f3f4f6; --chip-line:rgba(20,20,20,0.12);
    --ok:#1a8f4a; --bad:#d23b3b; --warn:#c98a00; --grey:#8a9099; --neutral:#c2c6cc;
    --serif: ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;
    background:var(--chip);padding:1px 6px;border-radius:6px}
  /* top bar */
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
    padding:18px 28px;border-bottom:1px solid var(--line);background:var(--card)}
  .brand{font-family:var(--serif);font-size:20px;letter-spacing:.2px}
  .brand .sub{font-family:var(--sans);font-size:12px;color:var(--faint);margin-left:8px;
    text-transform:uppercase;letter-spacing:.14em}
  nav{display:flex;gap:4px}
  .navbtn{font-size:13px;color:var(--muted);background:none;border:none;cursor:pointer;
    padding:6px 12px;border-radius:999px}
  .navbtn:hover{color:var(--ink)}
  .navbtn.on{color:var(--ink);background:var(--chip)}
  /* layout */
  main{max-width:940px;margin:0 auto;padding:28px 28px 80px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:22px 24px;margin-bottom:18px}
  .card.tight{padding:16px 18px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
  h2.section{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 0 4px}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .small{font-size:12.5px}
  .hr{height:1px;background:var(--line-soft);margin:16px 0;border:0}
  /* buttons */
  .btn{font:inherit;font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:10px;
    border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  .btn:hover{opacity:.88}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--ink);opacity:1}
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .link{background:none;border:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12.5px;
    text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;padding:0}
  .link:hover{color:var(--ink)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  /* chip-rule sentence */
  .sentence{font-size:16px;line-height:2.1}
  .sentence .lead{color:var(--muted)}
  .comb{font:inherit;font-size:15px;font-weight:600;color:var(--accent);background:none;border:none;
    cursor:pointer;padding:0 2px;border-bottom:1px dotted var(--accent)}
  .comb.ro{cursor:default;border-bottom:none}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--chip);
    border:1px solid var(--chip-line);border-radius:999px;padding:4px 12px;font-size:13.5px;
    margin:0 1px;white-space:nowrap}
  .chip.der{background:#f4f0fb;border-color:#e3d8f7}
  .chip-x{border:none;background:none;cursor:pointer;color:var(--faint);font-size:15px;line-height:1;padding:0}
  .chip-x:hover{color:var(--bad)}
  .subgroup{display:inline;color:var(--muted)}
  .addchip{border:1px dashed var(--chip-line);background:none;border-radius:999px;
    padding:4px 12px;font-size:13px;color:var(--muted);cursor:pointer;margin:0 1px}
  .addchip:hover{border-style:solid;border-color:var(--ink);color:var(--ink)}
  /* picker */
  .picker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .search{width:100%;padding:10px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font:inherit;font-size:14px;margin-bottom:14px}
  .search:focus{outline:none;border-color:var(--accent)}
  .grp{margin-bottom:14px}
  .grp .gh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .fields{display:flex;flex-wrap:wrap;gap:7px}
  .fchip{border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:6px 13px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
  .fchip:hover{border-color:var(--ink)}
  .fchip .ty{color:var(--faint);font-size:11px}
  .fchip.der:hover{border-color:#8b5cf6}
  .fchip.blocked{cursor:not-allowed;color:var(--faint);background:var(--bg);opacity:.7}
  .fchip.blocked:hover{border-color:var(--line)}
  .fchip .lock{font-size:11px;color:var(--bad)}
  /* condition editor */
  .editor label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
  .editor .field-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  select,input[type=text],input[type=number],input[type=date]{padding:9px 11px;border-radius:9px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
  select:focus,input:focus{outline:none;border-color:var(--accent)}
  .leak-note{background:#fbf3e6;border:1px solid #f0dcb4;color:#8a6310;border-radius:10px;
    padding:9px 12px;font-size:12.5px;margin:10px 0}
  .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
  /* enum_select picker (searchable) */
  .enumwrap{min-width:240px}
  .enumlist{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .enopt{padding:6px 11px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line-soft)}
  .enopt:last-child{border-bottom:none}
  .enopt:hover{background:var(--chip)}
  .enopt.on{background:#eef4ff;color:var(--accent);font-weight:600}
  .enopt.on:before{content:"✓ ";color:var(--accent)}
  .enumcount{font-size:11.5px;color:var(--faint);margin-top:5px}
  /* date SELECTION rule -- visually distinct from the discovery/holdout split cutoff */
  .daterule{border:1px solid var(--accent);background:#eef4ff;border-radius:10px;padding:10px 12px}
  .daterule .dr-cap{font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;
    margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:600}
  /* split + betting controls */
  .ctl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
  .ctl-row input[type=date]:disabled{opacity:.4}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .segbtn{font:inherit;font-size:13px;color:var(--muted);background:var(--card);border:none;
    padding:8px 14px;cursor:pointer;border-right:1px solid var(--line)}
  .segbtn:last-child{border-right:none}
  .segbtn:hover{color:var(--ink)}
  .segbtn.on{background:var(--ink);color:#fff}
  /* verdict header */
  .verdict{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:16px;margin:2px 0 2px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .d-ok{background:var(--ok)} .d-bad{background:var(--bad)} .d-warn{background:var(--warn)}
  .d-grey{background:var(--grey)} .d-neutral{background:var(--neutral)}
  .vlabel{font-weight:600} .vreason{color:var(--muted);font-size:13.5px}
  /* stat columns */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}}
  .statcol{border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .statcol .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .bignum{font-family:var(--serif);font-size:34px;line-height:1.1;margin:6px 0 2px}
  .bignum.pos{color:var(--ok)} .bignum.neg{color:var(--bad)}
  .statline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
  .statline b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .timing{font-size:12px;color:var(--faint);margin-top:8px}
  .timing .v{font-variant-numeric:tabular-nums}
  .rulebar{font-size:14px;color:var(--ink);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
  /* scan grid */
  .summary{font-size:14px;color:var(--muted);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .race{border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:var(--card);cursor:pointer}
  .race:hover{border-color:var(--ink)}
  .race .rc{font-family:var(--serif);font-size:17px}
  .race .rc .t{color:var(--muted);font-weight:400;font-size:14px;margin-left:6px}
  .race .meta{font-size:12.5px;color:var(--faint);margin:4px 0 10px}
  .race .top{font-size:13.5px}
  .race .top .n{font-weight:600}
  .race .more{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px;font-size:12.5px}
  .race .more .q{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted)}
  .race .more .q b{color:var(--ink);font-weight:500}
  /* track */
  .subnav{display:flex;gap:6px;margin-bottom:18px}
  .subnav .sb{font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;cursor:pointer}
  .subnav .sb.on{color:var(--ink);border-color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--faint);font-weight:500;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;padding:7px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.pos{color:var(--ok)} td.neg{color:var(--bad)}
  td input,td select{padding:5px 7px;font-size:12.5px}
  tr.empty td{color:var(--faint);font-style:italic;text-align:center;padding:20px}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:6px}
  .stat .v{font-family:var(--serif);font-size:24px}
  .stat .v.pos{color:var(--ok)} .stat .v.neg{color:var(--bad)}
  .stat .l{font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
  .vchip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
  .empty-state{text-align:center;color:var(--muted);padding:40px 20px}
  .empty-state .big{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:6px}
  details.json>summary{cursor:pointer;color:var(--faint);font-size:12px;list-style:none}
  details.json pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:11.5px;overflow:auto;max-height:240px}
  .hide{display:none}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Racing Edge<span class="sub">rule lab</span></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script>
/* ===========================================================================
   index_editorial.html -- editorial-cards restyle (Direction F) + folded-in
   tracker. PRESENTATION ONLY. Same JSON contracts, same bridge endpoints
   (/run, /scan), same four verdict states, same leakage gate, same price-free
   scanner display, same clv.py P&L (back/lay CLV reciprocal, net 5%).
   Persistence = Export/Import JSON only (no localStorage/window.storage).
   =========================================================================== */
const MANIFEST = {
  source_csv: "data/joined/joined_gb_2018_2026.csv",
  n_columns: 52,
  operators: { numeric:["<","≤","=","≥",">","range"], enum_select:["is","in"], date:["on","before","after","range"], text_match:["is","in"], categorical:["is","in"], flag:["true","false"] },
  derived_leakage_note: "prior-run only — must join to history STRICTLY before current race date; no same-race or future data.",
  fields: [
    {name:"date",stage:"pre_race",type:"date",dtype:"object",selectable:true,control:"date"},
    {name:"region",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"constant"},
    {name:"course",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["Aintree", "Ascot", "Ayr", "Bangor-on-Dee", "Bath", "Beverley", "Brighton", "Carlisle", "Cartmel", "Catterick", "Chelmsford (AW)", "Cheltenham", "Chepstow", "Chester", "Doncaster", "Epsom", "Exeter", "Fakenham", "Ffos Las", "Fontwell", "Goodwood", "Hamilton", "Haydock", "Hereford", "Hexham", "Huntingdon", "Kelso", "Kempton", "Kempton (AW)", "Leicester", "Lingfield", "Lingfield (AW)", "Ludlow", "Market Rasen", "Musselburgh", "Newbury", "Newcastle", "Newcastle (AW)", "Newmarket", "Newmarket (July)", "Newton Abbot", "Nottingham", "Perth", "Plumpton", "Pontefract", "Redcar", "Ripon", "Salisbury", "Sandown", "Sedgefield", "Southwell", "Southwell (AW)", "Stratford", "Taunton", "Thirsk", "Towcester", "Uttoxeter", "Warwick", "Wetherby", "Wincanton", "Windsor", "Wolverhampton (AW)", "Worcester", "Yarmouth", "York"],value_source:"csv"},
    {name:"course_detail",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["Fbrs", "Grand National", "Inner", "July", "Mildmay", "New", "Old", "Rnd", "Row", "Str", "Summer", "Winter", "X-Country"],value_source:"csv"},
    {name:"off",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"text_match"},
    {name:"race_name",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"text_match"},
    {name:"type",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["Chase", "Flat", "Hurdle", "NH Flat"],value_source:"csv"},
    {name:"class",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["Class 1", "Class 2", "Class 3", "Class 4", "Class 5", "Class 6", "Class 7"],value_source:"csv"},
    {name:"pattern",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["Grade 1", "Grade 2", "Grade 3", "Group 1", "Group 2", "Group 3", "Listed"],value_source:"csv"},
    {name:"rating_band",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["0-100", "0-105", "0-106", "0-110", "0-115", "0-120", "0-125", "0-130", "0-132", "0-135", "0-140", "0-145", "0-150", "0-155", "0-50", "0-52", "0-53", "0-54", "0-55", "0-56", "0-57", "0-58", "0-59", "0-60", "0-61", "0-62", "0-63", "0-64", "0-65", "0-66", "0-67", "0-68", "0-69", "0-70", "0-71", "0-72", "0-73", "0-74", "0-75", "0-76", "0-77", "0-78", "0-79", "0-80", "0-82", "0-83", "0-84", "0-85", "0-87", "0-88", "0-89", "0-90", "0-92", "0-93", "0-95", "0-96", "0-97", "0-98", "45-60", "46-55", "61-75", "70-85"],value_source:"csv"},
    {name:"age_band",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["10yo+", "2-3yo", "2yo", "2yo+", "3-4yo", "3-5yo", "3-6yo", "3-7yo", "3yo", "3yo+", "4-5yo", "4-6yo", "4-7yo", "4-8yo", "4yo", "4yo+", "5-8yo", "5yo+", "6yo+", "7yo+", "8yo+", "9yo+"],value_source:"csv"},
    {name:"sex_rest",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["C & F", "C & G", "F", "F & M", "M"],value_source:"csv"},
    {name:"dist",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["1m", "1m1f", "1m1½f", "1m2f", "1m2½f", "1m3f", "1m3½f", "1m4f", "1m4½f", "1m5f", "1m5½f", "1m6f", "1m6½f", "1m7f", "1m7½f", "1m½f", "2m", "2m1f", "2m1½f", "2m2f", "2m2½f", "2m3f", "2m3½f", "2m4f", "2m4½f", "2m5f", "2m5½f", "2m6f", "2m6½f", "2m7f", "2m7½f", "2m½f", "3m", "3m1f", "3m1½f", "3m2f", "3m2½f", "3m3f", "3m3½f", "3m4f", "3m4½f", "3m5f", "3m5½f", "3m6f", "3m6½f", "3m7f", "3m7½f", "3m½f", "4m", "4m1f", "4m1½f", "4m2f", "4m2½f", "4m½f", "5f", "5½f", "6f", "6½f", "7f", "7½f"],value_source:"csv"},
    {name:"dist_f",stage:"pre_race",type:"numeric",dtype:"object",selectable:true,coerce:true,control:"numeric"},
    {name:"dist_m",stage:"pre_race",type:"numeric",dtype:"int64",selectable:true,control:"numeric",ops:["<", "≤", "≥", ">", "range"]},
    {name:"going",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["Firm", "Good", "Good To Firm", "Good To Soft", "Heavy", "Slow", "Soft", "Standard", "Standard To Fast", "Standard To Slow"],value_source:"csv"},
    {name:"surface",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["AW", "Turf"],value_source:"csv"},
    {name:"ran",stage:"pre_race",type:"numeric",dtype:"int64",selectable:true,control:"numeric"},
    {name:"num",stage:"pre_race",type:"numeric",dtype:"int64",selectable:true,control:"numeric"},
    {name:"pos",stage:"post_race",type:"numeric",dtype:"int64",selectable:false,note:"Finishing position — the outcome itself."},
    {name:"draw",stage:"pre_race",type:"numeric",dtype:"float64",selectable:true,control:"numeric"},
    {name:"ovr_btn",stage:"post_race",type:"numeric",dtype:"float64",selectable:false,note:"Beaten distance — result-derived."},
    {name:"btn",stage:"post_race",type:"numeric",dtype:"float64",selectable:false,note:"Beaten distance — result-derived."},
    {name:"horse",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"text_match"},
    {name:"age",stage:"pre_race",type:"numeric",dtype:"int64",selectable:true,control:"numeric"},
    {name:"sex",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["C", "F", "G", "H", "M", "R"],value_source:"csv"},
    {name:"lbs",stage:"pre_race",type:"numeric",dtype:"int64",selectable:true,control:"numeric"},
    {name:"hg",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"enum_select",values:["b", "b1", "bp", "bp1", "e", "e/s", "e/s1", "e/sp", "e/sp1", "e1", "eb", "eb1", "et", "et1", "etb", "etb1", "etp1", "ev1", "h", "h1", "hb", "hb1", "hc1", "he", "he1", "heb", "heb1", "het", "het1", "hetb1", "hp", "hp1", "ht", "ht1", "htb", "htb1", "htp", "htp1", "htv", "htv1", "hv", "hv1", "p", "p1", "t", "t1", "tb", "tb1", "tbp", "tp", "tp1", "tv", "tv1", "tvp", "v", "v1", "vp", "vp1"],value_source:"csv"},
    {name:"time",stage:"post_race",type:"categorical",dtype:"object",selectable:false,note:"Race time — result-derived."},
    {name:"secs",stage:"post_race",type:"numeric",dtype:"float64",selectable:false,note:"Race time — result-derived."},
    {name:"dec",stage:"post_race",type:"numeric",dtype:"float64",selectable:false,note:"Industry SP — settled at-the-off price."},
    {name:"jockey",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"text_match"},
    {name:"trainer",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"text_match"},
    {name:"prize",stage:"pre_race",type:"numeric",dtype:"float64",selectable:true,control:"numeric"},
    {name:"or",stage:"pre_race",type:"numeric",dtype:"object",selectable:true,coerce:true,control:"numeric"},
    {name:"rpr",stage:"post_race",type:"numeric",dtype:"int64",selectable:false,note:"Racing Post Rating — assigned post-race; leakage."},
    {name:"sire",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"text_match"},
    {name:"dam",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"text_match"},
    {name:"damsire",stage:"pre_race",type:"categorical",dtype:"object",selectable:true,control:"text_match"},

const COMMISSION = 0.05;

/* ---- shared verdict convention (four states + neutral no-split) ---- */
const VERDICTS = {
  'ruled-in':   {label:'Ruled-in',   cls:'ok'},
  'priced':     {label:'Priced',     cls:'bad'},
  'to-holdout': {label:'To-holdout', cls:'warn'},
  'thin':       {label:'Thin',       cls:'grey'},
};
function verdictMeta(v){ return v ? (VERDICTS[v] || {label:v, cls:'grey'}) : {label:'No split', cls:'neutral'}; }
function verdictHeader(v, reason){
  const m = verdictMeta(v);
  return `<div class="verdict"><span class="dot d-${m.cls}"></span><span class="vlabel">${m.label}</span>`
    + (reason ? `<span class="vreason">— ${esc(reason)}</span>` : '') + `</div>`;
}
function verdictChip(v){
  const m = verdictMeta(v);
  return `<span class="vchip"><span class="dot d-${m.cls}"></span>${m.label}</span>`;
}

/* ---- formatting ---- */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtPct = x => (x==null||isNaN(x)) ? '—' : (x>=0?'+':'') + (x*100).toFixed(2) + '%';
const money  = x => (x==null||isNaN(x)) ? '—' : (x>=0?'+':'') + Number(x).toFixed(2) + 'u';
const signCls = x => (x==null||isNaN(x)) ? '' : (x>=0?'pos':'neg');
const nfmt = n => (n==null) ? '—' : Number(n).toLocaleString();
const gbp = x => (x==null||isNaN(x)) ? '—' : '£' + Number(x).toLocaleString(undefined,{maximumFractionDigits:0});

/* ---- clv.py-exact P&L + CLV (back/lay; reciprocal, not negated) ---- */
const clvBack = (s,b) => s/b - 1;
const clvLay  = (s,b) => b/s - 1;
const backPnl = (s,won,k) => won ? k*(s-1)*(1-COMMISSION) : -k;
const layPnl  = (s,won,k) => won ? -k*(s-1) : k*(1-COMMISSION);

/* =========================== state =========================== */

const ROOT = { id:0, kind:'group', combinator:'all', children:[] };

/* ---- rule tree ---- */
function findGroup(id, node=ROOT){
  if(node.id===id) return node;
  for(const c of node.children) if(c.kind==='group'){ const r=findGroup(id,c); if(r) return r; }
  return null;
}
function findParent(id, node=ROOT){
  for(const c of node.children){
    if(c.id===id) return node;
    if(c.kind==='group'){ const r=findParent(id,c); if(r) return r; }
  }
  return null;
}
function countRules(node=ROOT){ return node.children.reduce((n,c)=> n + (c.kind==='rule'?1:countRules(c)), 0); }
function serializeNode(n){
  if(n.kind==='rule'){
    const o={ field:n.field, type:n.type, dtype:n.dtype, op:n.op, value:n.value };
    if(n.coerce) o.coerce=true;
    o.source_columns=n.source_columns;
    if(n.leakage_note) o.leakage_note=n.leakage_note;
    return o;
  }
  return { combinator:n.combinator, children:n.children.map(serializeNode) };
}
function currentStrategy(extra){
  const s = { source_csv:MANIFEST.source_csv, selection_rules:serializeNode(ROOT) };
  if(state.split.on) s.split = { mode:'date', date_cutoff: state.split.cutoff || '2024-01-01' };
  const k = state.staking;
  if(k && k.on) s.staking = {
    model: k.model,
    bankroll: Number(k.bankroll) || 1000,
    pct: (Number(k.pct) || 0) / 100,          // UI shows %, bridge wants a fraction
    flat: Number(k.flat) || 0,
    kelly_fraction: Number(k.kelly_fraction) || 0,
  };
  return Object.assign(s, extra||{});
}

/* =========================== chip sentence =========================== */
function chipLabel(r){
  const v=r.value;
  if(r.type==='flag') return `${r.field} is ${v}`;
  if(r.type==='date'){
    if(r.op==='range') return `${r.field} in ${v[0]} … ${v[1]}`;
    const word = ({'=':'on','<':'before','>':'after'})[r.op] || r.op;
    return `${r.field} ${word} ${v}`;
  }
  if(r.type==='categorical') return r.op==='in' ? `${r.field} in ${Array.isArray(v)?v.join(', '):v}` : `${r.field} = ${v}`;
  if(r.op==='range') return `${v[0]} ≤ ${r.field} ≤ ${v[1]}`;
  return `${r.field} ${r.op} ${v}`;
}
function renderSentenceHTML(group, isRoot, ro){
  const word = group.combinator==='all' ? 'all' : 'any';
  let h = isRoot ? `<span class="lead">match </span>` : '';
  h += ro
    ? `<span class="comb ro">${word}</span>`
    : `<button class="comb" title="toggle all / any" onclick="toggleComb(${group.id})">${word}</button>`;
  const items = group.children.map(c => {
    if(c.kind==='rule'){
      const x = ro ? '' : ` <button class="chip-x" title="remove" onclick="removeNode(${c.id})">×</button>`;
      return `<span class="chip${c.group==='derived'?' der':''}">${esc(chipLabel(c))}${x}</span>`;
    }
    return `<span class="subgroup">( ${renderSentenceHTML(c,false,ro)} )</span>`;
  });
  if(items.length) h += ' · ' + items.join(' ');
  if(!ro){
    h += ` <button class="addchip" onclick="openPicker(${group.id})">+ add</button>`;
    h += ` <button class="addchip" onclick="addGroup(${group.id})">+ group</button>`;
  } else if(!items.length){
    h += ` <span class="faint">(no conditions)</span>`;
  }
  return h;
}

/* ---- tree mutations ---- */
function toggleComb(id){ const g=findGroup(id); if(g){ g.combinator = g.combinator==='all'?'any':'all'; renderMode(); } }
function addGroup(id){ const p=findGroup(id)||ROOT; const ng={id:nodeSeq++,kind:'group',combinator:'all',children:[]}; p.children.push(ng); state.activeGroupId=ng.id; renderMode(); }
function removeNode(id){ const p=findParent(id); if(!p) return; p.children=p.children.filter(c=>c.id!==id); renderMode(); }
function clearRule(){ ROOT.children=[]; state.activeGroupId=0; renderMode(); }

/* ---- picker ---- */
function openPicker(gid){ state.picker={open:true,groupId:gid,field:null,fieldGroup:null}; renderMode(); }
function closePicker(){ state.picker.open=false; renderMode(); }
function fieldListHTML(q){
  q=(q||'').toLowerCase();
  const match = f => f.name.toLowerCase().includes(q);
  const pre = MANIFEST.fields.filter(f=>f.stage==='pre_race' && f.control!=='constant' && match(f));
  const der = MANIFEST.derived_features.filter(match);
  const post = MANIFEST.fields.filter(f=>f.stage==='post_race' && match(f));
  const chips = (list, gk) => list.length
    ? list.map(f=>{
        if(gk==='post') return `<span class="fchip blocked" title="${esc(f.note||'post-race / leakage')}">${f.name}<span class="lock">⊘ leakage</span></span>`;
        const cls = gk==='der' ? 'fchip der' : 'fchip';
        return `<button class="${cls}" onclick="chooseField('${f.name}','${gk}')">${f.name}<span class="ty">${f.type}${f.coerce?' · coerce':''}</span></button>`;
      }).join('')
    : `<span class="faint small">— none —</span>`;
  return `<div class="grp"><div class="gh">Pre-race</div><div class="fields">${chips(pre,'pre')}</div></div>`
    + `<div class="grp"><div class="gh">Derived · prior-run</div><div class="fields">${chips(der,'der')}</div></div>`
    + `<div class="grp"><div class="gh">Post-race · blocked</div><div class="fields">${chips(post,'post')}</div></div>`;
}
function updateFieldList(){ const el=document.getElementById('fieldList'); if(el) el.innerHTML=fieldListHTML(document.getElementById('pickSearch').value); }
function chooseField(name, gk){
  const def = gk==='der' ? MANIFEST.derived_features.find(f=>f.name===name)
                         : MANIFEST.fields.find(f=>f.name===name && f.stage==='pre_race');
  state.picker.field = Object.assign({}, def, {group: gk==='der'?'derived':'pre'});
  state.picker.fieldGroup = gk;
  state.picker.enumSel = new Set(); state.picker.enumOne = null;   // reset enum picker state
  renderMode();
}
function controlOf(f){ return f.control || (f.type==='flag'?'flag':f.type==='numeric'?'numeric':'text_match'); }
function conditionEditorHTML(){
  const f = state.picker.field;
  const control = controlOf(f);
  const ops = f.ops || MANIFEST.operators[control] || MANIFEST.operators[f.type];
  let h = `<div class="editor">`;
  if(f.group==='derived') h += `<div class="leak-note">⚠ <b>Prior-run only.</b> ${esc(MANIFEST.derived_leakage_note)}</div>`;
  h += `<div class="field-row">
    <div><label>Field</label><div class="chip">${f.name}</div></div>
    <div><label>Operator</label><select id="op" onchange="updateValWrap()">${ops.map(o=>`<option>${o}</option>`).join('')}</select></div>
    <div id="valwrap"></div>
    <div><button class="btn sm" onclick="addCondition()">Add condition</button></div>
  </div><div class="err" id="cerr"></div></div>`;
  return h;
}
function valWrapHTML(){
  const f = state.picker.field, control = controlOf(f);
  const ops = f.ops || MANIFEST.operators[control] || MANIFEST.operators[f.type];
  const op = (document.getElementById('op')||{}).value || ops[0];
  if(control==='flag') return '';
  if(control==='enum_select'){ setTimeout(renderEnumList,0); return enumControlHTML(f, op); }
  if(control==='date'){
    const cap = `<div class="dr-cap">📅 race-date filter · not the discovery/holdout split</div>`;
    if(op==='range') return `<div class="daterule">${cap}<label>From (on/after)</label><input type="date" id="v1">
      <label style="margin-top:6px">To (on/before)</label><input type="date" id="v2"></div>`;
    return `<div class="daterule">${cap}<label>Date (${op})</label><input type="date" id="v1"></div>`;
  }
  if(control==='text_match'){
    const ph = op==='in' ? 'value1, value2…' : 'text to match';
    return `<div><label>${op==='in'?'Values (comma-sep)':'Value'}</label><input type="text" id="v1" placeholder="${ph}">
      <div class="faint small" style="margin-top:4px">Exact match · high-cardinality free text</div></div>`;
  }
  if(op==='range') return `<div><label>Min ≥</label><input type="number" id="v1" step="any" style="width:100px"></div><div><label>Max ≤</label><input type="number" id="v2" step="any" style="width:100px"></div>`;
  return `<div><label>Value</label><input type="number" id="v1" step="any" style="width:120px"></div>`;
}
function updateValWrap(){ const el=document.getElementById('valwrap'); if(el){ el.innerHTML=valWrapHTML(); } }

/* ---- enum_select picker: searchable, single ("is") or multi ("in") ---- */
function enumControlHTML(f, op){
  const searchable = (f.values||[]).length > 12;
  let h = `<div class="enumwrap"><label>${op==='in'?'Values — pick one or more':'Value — pick one'}</label>`;
  if(searchable) h += `<input class="search" id="enumsearch" placeholder="Search ${(f.values||[]).length} values…" oninput="renderEnumList()" style="margin:4px 0 6px">`;
  h += `<div class="enumlist" id="enumlist"></div><div class="enumcount" id="enumcount"></div></div>`;
  return h;
}
function renderEnumList(){
  const f = state.picker.field, op = (document.getElementById('op')||{}).value;
  const list = document.getElementById('enumlist'); if(!list) return;
  const se = document.getElementById('enumsearch');
  const q = (se ? se.value : '').toLowerCase();
  const rows = (f.values||[]).map((v,i)=>({v,i})).filter(o=>String(o.v).toLowerCase().includes(q));
  list.innerHTML = rows.length
    ? rows.map(o=>{
        const sel = op==='in' ? state.picker.enumSel.has(o.v) : state.picker.enumOne===o.v;
        return `<div class="enopt${sel?' on':''}" onclick="toggleEnumIdx(${o.i})">${esc(o.v)}</div>`;
      }).join('')
    : `<div class="faint small" style="padding:8px 11px">— no match —</div>`;
  const cnt = document.getElementById('enumcount');
  if(cnt) cnt.textContent = op==='in'
    ? `${state.picker.enumSel.size} selected of ${(f.values||[]).length}`
    : (state.picker.enumOne ? `selected: ${state.picker.enumOne}` : `${(f.values||[]).length} options`);
}
function toggleEnumIdx(i){
  const f = state.picker.field, op = (document.getElementById('op')||{}).value, v = f.values[i];
  if(op==='in'){ state.picker.enumSel.has(v) ? state.picker.enumSel.delete(v) : state.picker.enumSel.add(v); }
  else { state.picker.enumOne = (state.picker.enumOne===v ? null : v); }
  renderEnumList();
}
function addCondition(){
  const f=state.picker.field, op=document.getElementById('op').value, err=document.getElementById('cerr');
  err.textContent='';
  const control = controlOf(f);
  let value, serType=f.type, serOp=op;
  if(control==='flag'){ value = (op==='true'); serType='flag'; }
  else if(control==='enum_select'){
    serType='categorical';
    if(op==='in'){ value = Array.from(state.picker.enumSel); if(!value.length){ err.textContent='Pick at least one value.'; return; } }
    else { if(!state.picker.enumOne){ err.textContent='Pick a value.'; return; } value = state.picker.enumOne; }
  }
  else if(control==='text_match'){
    serType='categorical';
    const raw=(document.getElementById('v1').value||'').trim();
    if(!raw){ err.textContent='Enter a value.'; return; }
    value = op==='in' ? raw.split(',').map(s=>s.trim()).filter(Boolean) : raw;
    if(op==='in' && !value.length){ err.textContent='Enter at least one value.'; return; }
  }
  else if(control==='date'){
    serType='date'; serOp = ({on:'=',before:'<',after:'>',range:'range'})[op] || op;
    if(op==='range'){
      const a=document.getElementById('v1').value, b=document.getElementById('v2').value;
      if(!a||!b){ err.textContent='Enter both dates.'; return; }
      if(a>b){ err.textContent='From must be ≤ To.'; return; }
      value=[a,b];
    } else { const a=document.getElementById('v1').value; if(!a){ err.textContent='Pick a date.'; return; } value=a; }
  }
  else {
    serType='numeric';
    if(op==='range'){
      const a=document.getElementById('v1').value, b=document.getElementById('v2').value;
      if(a===''||b===''){ err.textContent='Enter both bounds.'; return; }
      if(+a>+b){ err.textContent='Min must be ≤ Max.'; return; }
      value=[+a,+b];
    } else { const a=document.getElementById('v1').value; if(a===''){ err.textContent='Enter a value.'; return; } value=+a; }
  }
  const rule={ id:nodeSeq++, kind:'rule', field:f.name, group:f.group, type:serType, dtype:f.dtype||null,
    op:serOp, value, coerce:!!f.coerce, source_columns:f.source_columns||[f.name],
    leakage_note: f.group==='derived' ? MANIFEST.derived_leakage_note : undefined };
  (findGroup(state.picker.groupId)||ROOT).children.push(rule);
  state.picker.open=false;
  renderMode();
}

/* =========================== bridge calls =========================== */
async function previewCount(){
  if(!countRules()){ flash('build-msg','Add a condition first.'); return; }
  setBusy('Counting…');
  let d;
  try{ d = await (await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentStrategy({mode:'count'}))})).json(); }
  catch(e){ setBusy(''); flash('build-msg', bridgeDown()); return; }
  setBusy('');
  const el=document.getElementById('build-msg');
  if(el){ el.innerHTML = d.ok ? `<span class="muted">~${nfmt(d.qualifier_count)} qualifiers of ${nfmt(d.rows_scanned)} runners.</span>`
                              : `<span class="neg">${esc((d.errors||['error']).join('; '))}</span>`; }
}
async function runBacktest(){
  if(!countRules()){ flash('build-msg','Add a condition first.'); return; }
  setBusy('Running backtest…');
  let d;
  try{ d = await (await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentStrategy({mode:'backtest'}))})).json(); }
  catch(e){ setBusy(''); flash('build-msg', bridgeDown()); return; }
  setBusy('');
  state.lastBacktest = d;
  state.lastBacktestRule = renderSentenceHTML(ROOT, true, true);
  setMode('backtest');
}
async function scanToday(){
  if(!countRules()){ flash('build-msg','Add a condition first.'); return; }

  try{ d = await (await fetch(SCAN_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentStrategy())})).json(); }
  catch(e){ setBusy(''); flash('build-msg', bridgeDown()); return; }
  setBusy('');
  state.lastScan = d;
  state.lastScanRule = renderSentenceHTML(ROOT, true, true);
  setMode('scan');
}
function bridgeDown(){ return `<span class="neg">Bridge not reachable.</span> <span class="muted">Start it: <code>python run_strategy.py --serve</code></span>`; }
function flash(id,msg){ const el=document.getElementById(id); if(el) el.innerHTML=msg; }
function setBusy(s){ state.busy=s; const el=document.getElementById('build-msg'); if(el && s) el.innerHTML=`<span class="muted">${esc(s)}</span>`; }

/* =========================== mode renders =========================== */
function setMode(m){
  state.mode=m; renderNav();
  if(m==='races' && !state.races.data && !state.races.busy){ loadRaces(); }   // auto-load on first entry
  else { renderMode(); }
  window.scrollTo(0,0);
}
function renderNav(){
  const modes=[['build','Build'],['backtest','Backtest'],['scan','Scan'],['races','Races'],['track','Track']];
  const active = state.mode==='runner' ? 'races' : state.mode;   // runner is a drill destination of Races
  document.getElementById('nav').innerHTML = modes.map(([k,l])=>
    `<button class="navbtn${active===k?' on':''}" onclick="setMode('${k}')">${l}</button>`).join('');
}
function renderMode(){
  renderNav();
  const m=document.getElementById('main');
  if(state.mode==='build') m.innerHTML = renderBuild();
  else if(state.mode==='backtest') m.innerHTML = renderBacktestHTML(state.lastBacktest, state.lastBacktestRule);
  else if(state.mode==='scan') m.innerHTML = renderScanHTML(state.lastScan, state.lastScanRule);
  else if(state.mode==='races') m.innerHTML = renderRacesHTML();
  else if(state.mode==='runner') m.innerHTML = renderRunnerStub();
  else m.innerHTML = renderTrackHTML();
}

function renderBuild(){
  const p = state.picker;
  let picker='';
  if(p.open){
    picker = `<div class="card"><div class="picker-head"><h2 class="section">Add a condition</h2><button class="link" onclick="closePicker()">cancel</button></div>`;
    picker += p.field ? conditionEditorHTML()
      : `<input id="pickSearch" class="search" placeholder="Find a field…" oninput="updateFieldList()" autofocus><div id="fieldList">${fieldListHTML('')}</div>`;
    picker += `</div>`;
  }
  return `
    <div class="card">
      <p class="eyebrow">Rule</p>
      <div class="sentence">${renderSentenceHTML(ROOT, true, false)}</div>
      ${countRules()? `<div class="actions"><button class="link" onclick="clearRule()">clear all</button></div>`:''}
    </div>
    ${picker}

/* ---- bankroll curve (two settle prices on shared axes) ---- */
function bankrollSVG(stk){
  const W=440,H=130,padL=8,padR=8,padT=10,padB=12;
  const cs=stk.struck.curve||[], cb=stk.bsp.curve||[];
  const all=cs.concat(cb); if(!all.length) return '';
  const ys=all.map(p=>p[1]), xs=all.map(p=>p[0]);
  const bank0=stk.config.bankroll;
  let ymin=Math.min(bank0,...ys), ymax=Math.max(bank0,...ys);
  if(ymax<=ymin) ymax=ymin+1;
  const xmax=Math.max(1,...xs);
  const X=x=> padL + (x/xmax)*(W-padL-padR);
  const Y=y=> H-padB - ((y-ymin)/(ymax-ymin))*(H-padT-padB);
  const path=c=> c.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const y0=Y(bank0).toFixed(1);
  const bspCol=stk.bsp.roi>=0?'var(--ok)':'var(--bad)';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;margin:4px 0">
    <line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <path d="${path(cs)}" fill="none" stroke="var(--faint)" stroke-width="1.25" stroke-dasharray="4 3" opacity="0.85"/>
    <path d="${path(cb)}" fill="none" stroke="${bspCol}" stroke-width="1.75"/>
  </svg>`;
}
function bankrollPanelHTML(stk, label){
  if(!stk) return '';
  const cfg=stk.config;
  const ml={fixed_pct:`fixed ${(cfg.pct*100).toFixed(1)}% of bank`, flat:`flat £${cfg.flat}/bet`, kelly:`${cfg.kelly_fraction}× Kelly`}[cfg.model]||cfg.model;
  const row=(s,muted)=>`<div class="statline"><span>${muted?'@struck (wap)':'@BSP'}</span>`
    + `<b class="${muted?'':signCls(s.roi)}">${gbp(s.final_bank)} · ${fmtPct(s.roi)} · DD ${(s.max_drawdown*100).toFixed(0)}%${s.ruin?' · RUIN':''}</b></div>`;
  const cov = stk.kelly_coverage
    ? `<div class="faint small" style="margin-top:6px">Kelly: ${nfmt(stk.kelly_coverage.n_with_prob)}/${nfmt(stk.kelly_coverage.n_total)} bets had a model prob (rest stood aside).</div>` : '';
  return `<div class="statcol">
    <div class="lab">${esc(label)} · bankroll</div>
    <div class="faint small" style="margin:4px 0 4px">${esc(ml)} · from ${gbp(cfg.bankroll)} · ${nfmt(stk.n_bets)} bets</div>
    ${bankrollSVG(stk)}

    ${row(stk.struck,true)}
    <div class="timing" style="margin-top:6px">solid = @BSP (honest) · dashed = @struck (timing artifact)</div>
    ${cov}
  </div>`;
}
function stakingRowHTML(blocks){

function betCLV(b){ if(b.bsp==null||!(b.bsp>1)||!(b.struck>1)) return null; return b.side==='lay'?clvLay(b.struck,b.bsp):clvBack(b.struck,b.bsp); }
function betPnl(b){ if(b.result==='void'||b.result==='pending') return null; const won=b.result==='won'; return b.side==='lay'?layPnl(b.struck,won,b.stake):backPnl(b.struck,won,b.stake); }
function trackFwdHTML(){
  const bets=state.track.forwardBets;
  const priced=bets.filter(b=>betCLV(b)!=null), settled=bets.filter(b=>betPnl(b)!=null);
  const meanCLV=priced.length?priced.reduce((s,b)=>s+betCLV(b),0)/priced.length:null;
  const beat=priced.length?priced.filter(b=>betCLV(b)>0).length/priced.length:null;
  const staked=settled.reduce((s,b)=>s+b.stake,0), pnl=settled.reduce((s,b)=>s+betPnl(b),0);
  const roi=staked>0?pnl/staked:null, pending=bets.filter(b=>b.result==='pending').length;
  const stat=(v,l,c)=>`<div class="stat"><div class="v ${c||''}">${v}</div><div class="l">${l}</div></div>`;
  const stats=`<div class="stats">
    ${stat(bets.length, `bets · ${settled.length} settled · ${pending} pending`)}
    ${stat(meanCLV!=null?fmtPct(meanCLV):'—','mean CLV',signCls(meanCLV))}
    ${stat(beat!=null?(beat*100).toFixed(0)+'%':'—','beat the close')}
    ${stat(money(pnl),'P&L net 5%',signCls(pnl))}
    ${stat(roi!=null?fmtPct(roi):'—','ROI',signCls(roi))}</div>`;
  const form=`<div class="card tight" style="margin:14px 0">
    <div class="field-row">
      <div><label>Date</label><input type="date" id="f-date"></div>
      <div><label>Selection</label><input type="text" id="f-sel" placeholder="horse — race"></div>
      <div><label>Side</label><select id="f-side"><option value="back">back</option><option value="lay">lay</option></select></div>
      <div><label>Struck</label><input type="number" id="f-struck" step="0.01" min="1.01" style="width:90px"></div>
      <div><label>BSP</label><input type="number" id="f-bsp" step="0.01" min="1.01" style="width:90px" placeholder="—"></div>
      <div><label>Result</label><select id="f-result"><option value="pending">pending</option><option value="won">horse won</option><option value="lost">horse lost</option><option value="void">void</option></select></div>
      <div><label>Stake</label><input type="number" id="f-stake" step="0.1" min="0" value="1" style="width:70px"></div>
      <div><button class="btn sm" onclick="addForwardBet()">Add</button></div>
    </div><div class="err" id="f-err"></div></div>`;
  let rows = bets.length ? bets.map(b=>{
    const c=betCLV(b), p=betPnl(b);
    const opts=['pending','won','lost','void'].map(o=>`<option value="${o}"${b.result===o?' selected':''}>${o}</option>`).join('');
    return `<tr>
      <td class="muted small">${esc(b.date)}</td><td>${esc(b.sel)||'<span class="faint">—</span>'}</td>
      <td class="side-${b.side}">${b.side}</td><td class="num">${b.struck.toFixed(2)}</td>
      <td class="num"><input type="number" step="0.01" min="1.01" value="${b.bsp==null?'':b.bsp}" placeholder="—" onchange="updateBet(${b.id},'bsp',this.value)" style="width:74px"></td>
      <td><select onchange="updateBet(${b.id},'result',this.value)">${opts}</select></td>
      <td class="num ${signCls(c)}">${c==null?'<span class="faint">pending</span>':fmtPct(c)}</td>
      <td class="num ${signCls(p)}">${p==null?'<span class="faint">—</span>':money(p)}</td>
      <td><button class="link" onclick="removeFwd(${b.id})">×</button></td></tr>`;
  }).join('') : `<tr class="empty"><td colspan="9">No forward bets yet.</td></tr>`;
  return `<p class="eyebrow">Forward bets · CLV-first</p>${stats}${form}
    <table><tr><th>date</th><th>selection</th><th>side</th><th class="num">struck</th><th class="num">BSP</th><th>result</th><th class="num">CLV</th><th class="num">P&L</th><th></th></tr>${rows}</table>
    <div class="faint small" style="margin-top:8px">back CLV = struck/bsp−1 · lay CLV = bsp/struck−1 (reciprocal, sign-correct) · P&L net 5% per clv.py.</div>`;
}
function addForwardBet(){
  const err=document.getElementById('f-err'); err.textContent='';
  const struck=parseFloat(document.getElementById('f-struck').value);
  if(!(struck>1)){ err.textContent='Struck must be > 1.0'; return; }
  const stake=parseFloat(document.getElementById('f-stake').value);
  if(!(stake>=0)){ err.textContent='Stake must be ≥ 0'; return; }
  const bspRaw=document.getElementById('f-bsp').value.trim();
  state.track.forwardBets.unshift({
    id:state.track.seq++, date:document.getElementById('f-date').value||new Date().toISOString().slice(0,10),
    sel:document.getElementById('f-sel').value.trim(), side:document.getElementById('f-side').value,
    struck, bsp: bspRaw===''?null:parseFloat(bspRaw),
    result:document.getElementById('f-result').value, stake });
  renderMode();
}
function updateBet(id,field,raw){ const b=state.track.forwardBets.find(x=>x.id===id); if(!b) return;
  if(field==='bsp') b.bsp = raw.trim()===''?null:parseFloat(raw); else b.result=raw; renderMode(); }
function removeFwd(id){ state.track.forwardBets=state.track.forwardBets.filter(b=>b.id!==id); renderMode(); }

/* ---- persistence (file only) ---- */
function exportTrack(){
  const blob=new Blob([JSON.stringify(state.track,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='edge_tracker_state.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function importTrack(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result);
    state.track.backtests=Array.isArray(s.backtests)?s.backtests:[];
    state.track.forwardBets=Array.isArray(s.forwardBets)?s.forwardBets:[];
    const mx=Math.max(0,...state.track.backtests.map(b=>b.id||0),...state.track.forwardBets.map(b=>b.id||0));
    state.track.seq=Math.max(s.seq||0,mx+1); renderMode();
  }catch(e){ alert('Import failed: '+e.message); } };
  r.readAsText(f); input.value='';
}

/* =========================== init =========================== */
function init(){ const today=new Date().toISOString().slice(0,10); const d=document.getElementById('f-date'); if(d) d.value=today; state.races.date=today; renderNav(); renderMode(); }
init();
</script>
</body>
</html>
